# What the Phase 2 parser must find in the Tableau-authored fixture (from the build guide).
# Names are as written in the guide; the build notes in FIXTURE.md record any deviations.
workbook: sales_performance_legacy
connection: {kind: text_file, folder_suffix: demo/data/seed_42/legacy_csv}
logical_tables: [ORDERS_HDR.csv, RTN_LOG.csv]
physical_joins:   # all inside the ORDERS_HDR logical table
  - {type: inner, left: ORDERS_HDR.csv, right: ord_lines.csv, on: [[OrdID, OrdID]]}
  - {type: left, left: ord_lines.csv, right: PROD_MSTR.csv, on: [[ProdCode, ProdCode]]}
  - {type: left, left: PROD_MSTR.csv, right: prod_cat.csv, on: [[CatCd, CatCd]]}
  - {type: left, left: ORDERS_HDR.csv, right: CUSTMR.csv, on: [[CustNo, CustNo]]}
  - {type: left, left: CUSTMR.csv, right: RGN_LKP.csv, on: [[Rgn_Cd, Rgn_Cd]]}
relationships:
  - {from: ORDERS_HDR.csv, to: RTN_LOG.csv, on: [[OrdID, OrdID], [line_no, line_no]]}
datasource_filters:
  - {field: OrdStat, kind: categorical, exclude: [X]}
parameters:
  - {name: Top N, datatype: integer, current: 10, range: [5, 50, 5]}
calculated_fields:
  Line Gross: {expected_level: supported}
  Discount Amount: {expected_level: supported}
  Line Net: {expected_level: supported}
  Line Cost: {expected_level: supported}
  Gross Profit: {expected_level: supported}
  Net Revenue: {expected_level: supported}
  GP Margin %: {expected_level: supported}
  Orders: {expected_level: supported}
  AOV: {expected_level: supported}
  Return Rate: {expected_level: supported}
  Customer First Order: {expected_level: conditional, note: "FIXED: supported only with filter-order analysis (plan 6.4.1)"}
  Cohort Year: {expected_level: conditional, note: depends on Customer First Order}
  Running Net Revenue: {expected_level: unsupported, note: table calculation}
worksheets:
  KPI Summary: {filters: [year(OrdDt)=2025]}
  Revenue by Region: {filters: [year(OrdDt)=2025]}
  Monthly Trend: {filters: [year(OrdDt)=2025], table_calcs: [Running Net Revenue]}
  Category Profitability: {filters: [year(OrdDt)=2025]}
  Top Products: {filters: ["year(OrdDt)=2025 (context)", "top N ProdNm by Net Revenue"]}
  Customer Cohorts: {filters: [year(OrdDt)=2025]}
dashboards:
  Sales Performance: [KPI Summary, Revenue by Region, Monthly Trend, Category Profitability]
