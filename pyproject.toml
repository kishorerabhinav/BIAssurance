[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "biwb"
version = "0.1.0"
description = "BI Migration & Assurance Workbench: semantic equivalence testing for Tableau migrations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=26",
    "lxml>=5.3",
    "defusedxml>=0.7.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Synthetic demo environment, oracle and benchmark (kept out of the engine's core deps).
demo = [
    "numpy>=2.1",
    "pandas>=2.2",
]
# UI and AI layers are built in later phases; declared here so the extras are stable.
ui = ["streamlit>=1.40"]
ai = ["anthropic>=0.50"]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "numpy>=2.1",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biwb = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root is on the path so tests can import demo/ and benchmark/ (never the engine).
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: builds full-size synthetic datasets",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# numpy RNG for synthetic data (not cryptography); generator SQL is built from its own schema
# documents, never from user input, and never runs inside the engine.
"demo/**" = ["S311", "S608"]
